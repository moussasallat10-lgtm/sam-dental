<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المرضى – عيادة سام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0fb;--dot:#c9cdee;--card:#fff;--ink:#1e2150;--mut:#6b6f98;--brand:#3f4bb0;--brand2:#5865d0;--soft:#e3e6fa;--line:#e1e4f5;--ok:#17855a;--okb:#dff5ea;--wn:#a86610;--wnb:#fdf0d8;--no:#b8372f;--nob:#fbe4e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--dot:#262a55;--card:#1c1f42;--ink:#eceefe;--mut:#9ea3d4;--brand:#7b88f0;--brand2:#5865d0;--soft:#2a2e60;--line:#2c3066;--ok:#5fd5a0;--okb:#173a2e;--wn:#f0b45a;--wnb:#3d2f14;--no:#f58a82;--nob:#3f1d1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142b;--dot:#262a55;--card:#1c1f42;--ink:#eceefe;--mut:#9ea3d4;--brand:#7b88f0;--brand2:#5865d0;--soft:#2a2e60;--line:#2c3066;--ok:#5fd5a0;--okb:#173a2e;--wn:#f0b45a;--wnb:#3d2f14;--no:#f58a82;--nob:#3f1d1f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:32px 32px;min-height:100vh;font-size:16px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
header h1{font-size:22px;margin:0;font-weight:800;flex:1;line-height:1.2}
header h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut)}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--card);color:var(--brand);box-shadow:0 4px 14px rgba(63,75,176,.12);min-height:46px}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.pt:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 28px rgba(63,75,176,.1)}
.search{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:13px 16px;font-size:17px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:70vh;overflow:auto}
.pt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid transparent;background:var(--bg);cursor:pointer;text-align:start;width:100%}
.pt.on{border-color:var(--brand);background:var(--soft)}
.num{background:var(--brand);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;flex:none;direction:ltr}
.pt b{display:block;font-size:16px}.pt span.s{font-size:13px;color:var(--mut)}
.chip{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap;margin-inline-start:auto}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}.chip.no{background:var(--nob);color:var(--no)}
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#3f4bb0,#5865d0)}
.hero h2{margin:8px 0 4px;font-size:26px;font-weight:800}
.hero p{margin:2px 0;opacity:.9;font-size:15px}
.hero .num{background:#fff;color:#3f4bb0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:16px;padding:12px}
.stat small{color:var(--mut);display:block;font-size:13px}.stat b{font-size:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.visit{border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.visit h4{margin:0 0 4px;font-size:17px}
.vm{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.back{display:none;margin-bottom:12px}
dialog{border:0;border-radius:24px;padding:20px;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,60,.55)}
dialog h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 14px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.err{color:var(--no);font-size:14px;margin-top:8px;min-height:20px}
.foot{margin-top:16px;color:var(--mut);font-size:13px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
@media print{.wrap{display:none}dialog{position:static;box-shadow:none;width:100%}.noprint{display:none}}
@media (max-width:900px){
 .grid{grid-template-columns:1fr}
 .grid.sel #listp{display:none}.grid:not(.sel) #detail{display:none}
 .back{display:inline-block}.list{max-height:none}
}
@media (max-width:480px){.two{grid-template-columns:1fr}header h1{font-size:19px}.btn{padding:10px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M7 3c-2.5 0-4 2-4 4.5 0 2 .8 3.4 1.4 5.2.6 1.8.6 4.3 1.3 6.3.4 1.2 1.5 1.6 2.2.6C9 17 9.4 14 12 14s3 3 3.1 4.6c.7 1 1.8.6 2.2-.6.7-2 .7-4.5 1.3-6.3.6-1.8 1.4-3.2 1.4-5.2C20 5 18.500 3 16 3c-1.600 0-2.600.8-4 .8S8.600 3 7 3z"/></svg></div>
 <h1>عيادة سام<small>سجل المرضى والمدفوعات</small></h1>
 <button class="btn" id="exp">تصدير</button>
 <button class="btn pri" id="newp">+ مريض جديد</button>
</header>

<div class="grid" id="grid">
 <aside class="panel" id="listp">
  <input class="search" id="q" type="search" placeholder="ابحث بالاسم أو بالرقم" autocomplete="off" aria-label="بحث">
  <div class="list" id="list"></div>
 </aside>
 <section class="panel" id="detail"></section>
</div>
<p class="foot" id="foot"></p>
</div>
<dialog id="dlg"></dialog>

<script>
(function(){
var P={},sel=null,col=null,LS='sam_clinic_patients';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)||n<0?0:n}
function fmt(n){return Number(n).toLocaleString('en-US')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dayName(d){try{return new Date(d+'T00:00').toLocaleDateString('ar',{weekday:'long'})}catch(e){return''}}
function paySum(p){var s=0;(p.payments||[]).forEach(function(x){s+=x.amount});return s}
function eff(p){var pool=paySum(p),vs=(p.visits||[]).slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});return vs.map(function(v){var need=Math.max(0,v.total-v.paid),a=Math.min(need,pool);pool-=a;return Object.assign({},v,{ep:v.paid+a})})}
function totals(p){var t=0,d=paySum(p);(p.visits||[]).forEach(function(v){t+=v.total;d+=v.paid});return{t:t,d:d,r:Math.max(0,t-d)}}
function status(v){var pp=v.ep!=null?v.ep:v.paid,r=v.total-pp;if(r<=0)return['ok','مدفوع كامل'];if(pp>0)return['wn','مدفوع جزئي'];return['no','غير مدفوع']}

/* storage: shared db when available, otherwise this browser only */
function loadLocal(){try{var s=localStorage.getItem(LS);if(s)P=JSON.parse(s)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function persist(p){
 P[p.id]=p;
 if(col){col.doc(p.id).set(p).catch(function(){$('foot').textContent='تعذر الحفظ على الخادم، تحقق من الصلاحيات.'})}
 else saveLocal();
 render();
}
function nextId(){var m=1000;Object.keys(P).forEach(function(k){var n=parseInt(k,10);if(n>m)m=n});return String(m+1)}

/* list */
function renderList(){
 var q=$('q').value.trim().toLowerCase(),arr=Object.keys(P).map(function(k){return P[k]});
 arr.sort(function(a,b){return parseInt(b.id,10)-parseInt(a.id,10)});
 if(q){var parts=q.split(/\s+/);arr=arr.filter(function(p){var h=(p.id+' '+p.first+' '+p.last+' '+(p.father||'')+' '+(p.mother||'')+' '+(p.phone||'')).toLowerCase();return parts.every(function(w){return h.indexOf(w)>-1})})}
 if(!arr.length){$('list').innerHTML='<div class="empty">'+(Object.keys(P).length?'لا يوجد مريض بهذا الاسم أو الرقم':'لا يوجد مرضى بعد. اضغط «مريض جديد» لتسجيل أول مريض.')+'</div>';return}
 $('list').innerHTML=arr.map(function(p){var t=totals(p);
  return '<button class="pt'+(p.id===sel?' on':'')+'" data-id="'+esc(p.id)+'"><span class="num">'+esc(p.id)+'</span><span><b>'+esc(p.first)+' '+esc(p.last)+'</b><span class="s">'+(p.age?esc(p.age)+' سنة':'')+(p.visits&&p.visits.length?' · '+p.visits.length+' زيارة':'')+'</span></span>'+(t.r>0?'<span class="chip no">عليه '+fmt(t.r)+'</span>':'')+'</button>'}).join('');
}

/* detail */
function renderDetail(){
 var p=P[sel],g=$('grid');
 if(!p){g.classList.remove('sel');$('detail').innerHTML='<div class="empty">اختر مريضاً من القائمة أو ابحث عنه بالاسم أو الرقم لتظهر معلوماته وسجل زياراته.</div>';return}
 g.classList.add('sel');
 var t=totals(p),vs=eff(p).reverse(),ps=(p.payments||[]).slice().reverse();
 $('detail').innerHTML='<button class="btn sm back" id="bk">رجوع للقائمة</button>'+
 '<div class="hero"><span class="num">رقم '+esc(p.id)+'</span><h2>'+esc(p.first)+' '+esc(p.last)+'</h2>'+
 '<p>العمر: '+(p.age?esc(p.age)+' سنة':'غير مسجل')+'</p><p>اسم الأب: '+esc(p.father||'—')+' · اسم الأم: '+esc(p.mother||'—')+'</p>'+(p.phone?'<p>الهاتف: <span dir="ltr">'+esc(p.phone)+'</span></p>':'')+
 '<div class="row" style="margin-top:12px"><button class="btn sm" id="paym">تسديد دفعة</button><button class="btn sm" id="stm">كشف حساب</button><button class="btn sm" id="addv">+ زيارة جديدة</button><button class="btn sm" id="edp">تعديل المعلومات</button></div></div>'+
 '<div class="stats"><div class="stat"><small>عدد الزيارات</small><b>'+vs.length+'</b></div><div class="stat"><small>المجموع</small><b>'+fmt(t.t)+'</b></div><div class="stat"><small>المدفوع</small><b>'+fmt(t.d)+'</b></div><div class="stat"><small>المتبقي عليه</small><b style="color:'+(t.r>0?'var(--no)':'var(--ok)')+'">'+fmt(t.r)+'</b></div></div>'+
 (vs.length?vs.map(function(v){var s=status(v),r=v.total-v.ep;
  return '<div class="visit"><div class="row"><h4>'+esc(v.work||'بدون وصف')+'</h4><span class="chip '+s[0]+'">'+s[1]+'</span></div>'+
  '<div class="vm"><span>'+esc(dayName(v.date))+' '+esc(v.date)+' · '+esc(v.time)+'</span><span>المبلغ '+fmt(v.total)+' · المدفوع '+fmt(v.ep)+(r>0?' · المتبقي '+fmt(r):'')+'</span></div>'+
  '</div>'}).join(''):'<div class="empty">لا توجد زيارات مسجلة لهذا المريض.</div>')+(ps.length?'<h4 style="margin:18px 0 0">الدفعات المسددة</h4>'+ps.map(function(x){return '<div class="visit"><div class="vm"><span>'+esc(x.date)+' · '+esc(x.time)+'</span><b style="color:var(--ok)">+ '+fmt(x.amount)+'</b></div></div>'}).join(''):'');
}
function render(){renderList();renderDetail()}

/* dialogs */
var dlg=$('dlg');
function open(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal()}
function patientForm(p){
 p=p||{};
 open('<h3>'+(p.id?'تعديل مريض رقم '+esc(p.id):'مريض جديد')+'</h3><div class="two"><div><label>الاسم</label><input id="f1" value="'+esc(p.first)+'"></div><div><label>اسم العائلة</label><input id="f2" value="'+esc(p.last)+'"></div><div><label>اسم الأب</label><input id="f3" value="'+esc(p.father)+'"></div><div><label>اسم الأم</label><input id="f4" value="'+esc(p.mother)+'"></div><div><label>العمر</label><input id="f5" type="number" inputmode="numeric" min="0" max="120" value="'+esc(p.age)+'"></div><div><label>الهاتف</label><input id="f6" type="tel" dir="ltr" value="'+esc(p.phone)+'"></div></div><div class="err" id="er"></div><div class="row"><button class="btn pri" id="ok">حفظ</button><button class="btn" id="cx">إلغاء</button></div>');
 $('cx').onclick=function(){dlg.close()};
 $('ok').onclick=function(){
  var f=$('f1').value.trim(),l=$('f2').value.trim();
  if(!f||!l){$('er').textContent='اكتب الاسم واسم العائلة.';return}
  var q=p.id?p:{id:nextId(),visits:[]};
  q.first=f;q.last=l;q.father=$('f3').value.trim();q.mother=$('f4').value.trim();q.age=$('f5').value.trim();q.phone=$('f6').value.trim();
  sel=q.id;dlg.close();persist(q);
 };
}
function visitForm(){
 open('<h3>زيارة جديدة</h3><div class="two"><div><label>التاريخ</label><input id="v1" type="date" value="'+today()+'"></div><div><label>الوقت</label><input id="v2" type="time" value="'+nowT()+'"></div></div><label>الشغل المنجز</label><input id="v3" placeholder="مثال: حشوة، تنظيف، علاج عصب"><div class="two"><div><label>المبلغ المطلوب</label><input id="v4" type="number" inputmode="decimal" min="0"></div><div><label>المبلغ المدفوع</label><input id="v5" type="number" inputmode="decimal" min="0" value="0"></div></div><div class="quick"><button class="btn sm" id="qf">دفع كامل</button><button class="btn sm" id="qh">دفع النصف</button><button class="btn sm" id="qn">لم يدفع</button></div><div class="err" id="er"></div><div class="row"><button class="btn pri" id="ok">حفظ الزيارة</button><button class="btn" id="cx">إلغاء</button></div>');
 var tot=function(){return num($('v4').value)};
 $('qf').onclick=function(){$('v5').value=tot()};
 $('qh').onclick=function(){$('v5').value=tot()/2};
 $('qn').onclick=function(){$('v5').value=0};
 $('cx').onclick=function(){dlg.close()};
 $('ok').onclick=function(){
  var t=tot(),d=num($('v5').value);
  if(!$('v3').value.trim()){$('er').textContent='اكتب الشغل المنجز.';return}
  if(d>t){$('er').textContent='المدفوع أكبر من المبلغ المطلوب.';return}
  var p=P[sel];p.visits=(p.visits||[]).concat([{id:'v'+Date.now(),date:$('v1').value||today(),time:$('v2').value||nowT(),work:$('v3').value.trim(),total:t,paid:d}]);
  dlg.close();persist(p);
 };
}
function payForm(){
 var p=P[sel],r=totals(p).r;
 open('<h3>تسديد دفعة</h3><p style="margin:0;color:var(--mut)">'+esc(p.first)+' '+esc(p.last)+' · المتبقي عليه '+fmt(r)+'</p><label>المبلغ المدفوع الآن</label><input id="pa" type="number" inputmode="decimal" min="0" value="'+r+'"><p id="lf" style="margin:8px 0 0;font-weight:700"></p><div class="err" id="er"></div><div class="row"><button class="btn pri" id="ok">حفظ الدفعة</button><button class="btn" id="cx">إلغاء</button></div>');
 $('cx').onclick=function(){dlg.close()};
 var lf=function(){$('lf').textContent='سيتبقى عليه: '+fmt(Math.max(0,r-num($('pa').value)))};$('pa').oninput=lf;lf();
 $('ok').onclick=function(){var a=num($('pa').value);if(r<=0){$('er').textContent='لا يوجد مبلغ متبقٍ على هذا المريض.';return}if(a<=0||a>r){$('er').textContent='اكتب مبلغاً بين 1 و '+fmt(r)+'.';return}p.payments=(p.payments||[]).concat([{id:'p'+Date.now(),date:today(),time:nowT(),amount:a}]);dlg.close();persist(p)};
}

function statement(){
 var p=P[sel],t=totals(p),vs=(p.visits||[]).slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});
 var rows=vs.map(function(v){return '<tr><td>'+esc(v.date)+'</td><td>'+esc(v.work)+'</td><td>'+fmt(v.total)+'</td><td>'+fmt(v.paid)+'</td></tr>'}).join('')+(p.payments||[]).map(function(x){return '<tr><td>'+esc(x.date)+'</td><td>تسديد دفعة</td><td>—</td><td>'+fmt(x.amount)+'</td></tr>'}).join('');
 open('<div id="stmt"><h3>كشف حساب</h3><p style="margin:0 0 10px"><b>'+esc(p.first)+' '+esc(p.last)+'</b> · رقم '+esc(p.id)+' · '+today()+'</p><div style="overflow-x:auto"><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>المدفوع</th></tr>'+rows+'<tr><th colspan="2">المجموع</th><th>'+fmt(t.t)+'</th><th>'+fmt(t.d)+'</th></tr></table></div><div class="stat" style="margin:14px 0"><small>المتبقي عليه</small><b style="font-size:26px;color:'+(t.r>0?'var(--no)':'var(--ok)')+'">'+fmt(t.r)+'</b></div><div class="row noprint"><button class="btn pri" id="pr">طباعة</button><button class="btn" id="cx">إغلاق</button></div></div>');
 $('cx').onclick=function(){dlg.close()};$('pr').onclick=function(){window.print()};
}

/* export (CSV opens in Google Sheets or Excel) */
function csvCell(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){
 var rows=[['رقم المريض','الاسم','العائلة','الأب','الأم','العمر','الهاتف','التاريخ','الوقت','الشغل','المبلغ','المدفوع','المتبقي','الحالة']];
 Object.keys(P).sort(function(a,b){return a-b}).forEach(function(k){var p=P[k],base=[p.id,p.first,p.last,p.father,p.mother,p.age,p.phone];
  if(!(p.visits||[]).length)rows.push(base.concat(['','','','','','','']));
  eff(p).forEach(function(v){rows.push(base.concat([v.date,v.time,v.work,v.total,v.ep,v.total-v.ep,status(v)[1]]))})});
 var data='\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');
 var fn='sam-clinic-patients-'+today()+'.csv';
 var local=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
 if(!(window.claude&&claude.use)){local();return}
 claude.use('downloads').then(function(d){if(!d){local();return}return d.save({filename:fn,data:data})}).catch(function(){});
}

/* events */
$('q').addEventListener('input',renderList);
$('list').addEventListener('click',function(e){var b=e.target.closest('.pt');if(b){sel=b.dataset.id;render()}});
$('detail').addEventListener('click',function(e){
 var t=e.target;
 if(t.id==='bk'){sel=null;render()}
 else if(t.id==='addv')visitForm();
 else if(t.id==='edp')patientForm(P[sel]);
 else if(t.id==='paym')payForm();
 else if(t.id==='stm')statement();
});
$('newp').onclick=function(){patientForm()};
$('exp').onclick=exportCsv;

$('foot').textContent='جارٍ الاتصال بالتخزين المشترك…';
(function(){
 if(!(window.claude&&claude.use)){$('foot').textContent='البيانات محفوظة على هذا الجهاز فقط.';return}
 claude.use('db').then(function(db){
  if(!db){$('foot').textContent='البيانات محفوظة على هذا الجهاز فقط.';return}
  var c=db.collection('patients'),first=true;
  c.onSnapshot(function(s){
   var m={};s.docs.forEach(function(d){m[d.id]=d.data()});
   if(first&&s.empty&&Object.keys(P).length){Object.keys(P).forEach(function(k){c.doc(k).set(P[k])});m=P}
   first=false;P=m;col=c;
   if(sel&&!P[sel])sel=null;
   $('foot').textContent='متصل: البيانات مشتركة بين كل أجهزتك.';render();
  },function(){$('foot').textContent='البيانات محفوظة على هذا الجهاز فقط.'});
 }).catch(function(){$('foot').textContent='البيانات محفوظة على هذا الجهاز فقط.'});
})();
})();

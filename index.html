<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراكز العثمان والنصر للزيوت</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#c8102e;--ac2:#f5b800;--bd:#e7e5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1d2027;--tx:#f1f1ee;--mut:#9aa0ab;--bd:#2c3039}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--tx:#f1f1ee;--mut:#9aa0ab;--bd:#2c3039}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
.w{max-width:960px;margin:auto;padding:16px}
header{text-align:center;padding:28px 12px 8px}
.logo{width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;display:inline-grid;place-items:center;font-size:30px}
h1{margin:10px 0 4px;font-size:24px}header p{margin:0;color:var(--mut)}
h2{font-size:17px;margin:26px 0 10px}h2 span{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:99px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card h3{margin:0 0 4px;font-size:16px}.card small{color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--ac);color:#fff;text-decoration:none;font-size:14px}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.mgmt{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.img{height:110px;border-radius:10px;background:linear-gradient(135deg,#fdf3d0,#fbe3e6);display:grid;place-items:center;font-size:48px;margin-bottom:10px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;margin-left:4px}
.price{color:var(--ac);font-weight:700;font-size:18px}
.hide{display:none}.note{color:var(--mut);text-align:center;font-size:13px;margin:30px 0 10px}
</style>
</head>
<body>
<div class="w">
<header><div class="logo">🛢️</div><h1>مراكز العثمان والنصر للزيوت</h1><p>زيوت السيارات الأصلية — اختر فرعك الأقرب إليك</p></header>

<h2><span>1</span>اختر المحافظة</h2>
<div class="chips" id="gov"></div>

<div id="s2" class="hide">
<h2><span>2</span>اختر المركز الأقرب</h2>
<div class="grid" id="br"></div>
<div class="mgmt"><div><b>الإدارة العامة</b><br><small>للشكاوى والطلبات الخاصة</small></div><a class="btn" style="flex:none;padding:8px 18px" href="tel:+963000000000">اتصال</a></div>
</div>

<div id="s3" class="hide">
<h2><span>3</span>المنتجات</h2>
<small style="color:var(--mut)">بلد صنع السيارة</small>
<div class="chips" id="f1" style="margin:6px 0 10px"></div>
<small style="color:var(--mut)">نوع الوقود</small>
<div class="chips" id="f2" style="margin:6px 0 14px"></div>
<div class="grid" id="pr"></div>
</div>

<p class="note">نموذج تصميم أولي — الأسماء والأسعار والأرقام تجريبية</p>
</div>
<script>
var D={"اللاذقية":[["مركز اللاذقية","وسط المدينة"]],"إدلب":[["مركز سرمدا","سرمدا"],["مركز معرة مصرين","معرة مصرين"]],"حماة":[["مركز حماة","وسط المدينة"]],"دمشق":[["مركز دمشق","دمشق"]],"حلب":[["مركز حلب","حلب"]]};
var P=[["زيت 5W-30 صناعي","كورية","بنزين","كيا / هيونداي","🛢️",18],["زيت 10W-40 نصف صناعي","كورية","بنزين","كيا / هيونداي","🛢️",14],["زيت ديزل 15W-40","كورية","ديزل","كيا / هيونداي","🛢️",16],["زيت 0W-20 هايبرد","يابانية","بنزين","تويوتا / هوندا","🛢️",22],["زيت 5W-30 يابانية","يابانية","بنزين","نيسان / مازدا","🛢️",19],["زيت ديزل 5W-40","يابانية","ديزل","تويوتا / ميتسوبيشي","🛢️",21],["زيت 5W-40 لونغ لايف","ألمانية","بنزين","مرسيدس / BMW","🛢️",30],["زيت ديزل 5W-30 DPF","ألمانية","ديزل","فولكس / أودي","🛢️",32]];
var g=0,o="الكل",f="الكل";
function chips(id,arr,cur,fn){var e=document.getElementById(id);e.innerHTML="";arr.forEach(function(t){var b=document.createElement("button");b.className="chip"+(t===cur?" on":"");b.textContent=t;b.onclick=function(){fn(t)};e.appendChild(b)})}
function pg(k){g=k;chips("gov",Object.keys(D),g,pg);var h="";D[k].forEach(function(b,i){h+='<div class="card"><h3>'+b[0]+'</h3><small>📍 '+b[1]+', '+k+'</small><div class="btns"><a class="btn" href="tel:+96300000000'+i+'">اتصال</a><a class="btn o" href="https://maps.google.com/?q='+encodeURIComponent(b[0]+" "+k)+'" target="_blank">الموقع</a></div></div>'});document.getElementById("br").innerHTML=h;s2.classList.remove("hide");s3.classList.remove("hide");rp()}
function rp(){chips("f1",["الكل","كورية","يابانية","ألمانية"],o,function(t){o=t;rp()});chips("f2",["الكل","بنزين","ديزل"],f,function(t){f=t;rp()});var h="";P.forEach(function(p){if((o=="الكل"||p[1]==o)&&(f=="الكل"||p[2]==f))h+='<div class="card"><div class="img">'+p[4]+'</div><h3>'+p[0]+'</h3><span class="tag">'+p[1]+'</span><span class="tag">'+p[2]+'</span><br><small>'+p[3]+'</small><div class="price">$'+p[5]+'</div></div>'});document.getElementById("pr").innerHTML=h||'<p style="color:var(--mut)">لا توجد منتجات</p>'}
chips("gov",Object.keys(D),-1,pg);
</script>
</body>
</html>
